version: 2.1

jobs:
  test:
    docker:
      - image: cimg/python:3.12
    environment:
      OMP_NUM_THREADS: "1"
      PYTHONHASHSEED: "0"
    steps:
      - checkout
      - run:
          name: Install system packages
          command: |
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends \
              openssl poppler-utils build-essential libgdal-dev gdal-bin
      - run:
          name: Install Python dependencies
          command: |
            python3 -m pip install --upgrade pip
            python3 -m pip install \
              numpy scipy rasterio piexif pillow jsonschema matplotlib \
              scikit-learn reportlab cryptography
            python3 -m pip install -r sar/coldtrace/backend/requirements-test.txt
            python3 -m pip install -r sar/sensegame/fusion/requirements-fusion.txt
      - run:
          name: Run full SAR test suite
          command: python3 sar/registry.py --test-all

workflows:
  test:
    jobs:
      - test
